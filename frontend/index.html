<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>EduLearn</title>
    <meta name="description" content="Transform Your Learning Journey" />
    <meta name="author" content="EduLearn" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="EduLearn" />
    <meta property="og:description" content="Transform Your Learning Journey" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('vite-ui-theme') || 'light';
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            // Give it an initial dark background inline to completely prevent frame 1 flash
            document.documentElement.style.backgroundColor = 'hsl(222 47% 8%)'; 
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Pre-React initialization loader (modern, no text) -->
    <div id="root">
      <style>
        body {
          margin: 0;
          overflow: hidden;
        }
        .initial-loader-container {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          width: 100%;
          background-color: var(--initial-bg, #f8fafc);
          transition: background-color 0s;
        }
        html.dark .initial-loader-container {
          --initial-bg: hsl(222 47% 8%);
        }
        .initial-loader-spinner {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: hsl(221 83% 53%);
          border-right-color: hsl(221 83% 53% / 0.3);
          animation: initial-loader-spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        html.dark .initial-loader-spinner {
          border-top-color: hsl(217 91% 60%);
          border-right-color: hsl(217 91% 60% / 0.25);
        }
        @keyframes initial-loader-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
